name: AI Proxy
on:
  push:
    paths:
      - "query.txt"
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call API
        run: |
          QUERY=$(head -1 query.txt)
          echo "Query: $QUERY"
          python3 << 'PYEOF'
          import json, urllib.request
          query = open("query.txt").read().strip()
          payload = json.dumps({
              "model": "sensenova-6.8-flash-lite",
              "messages": [
                  {"role": "system", "content": "You are a metals analyst. Six-Dimension (1-10): Supply, Demand, Profit, Inventory, Speculation, Verification. Copper 3,4,8,3,7,8. Aluminum 5,6,7,4,5,7. Lead 4,3,5,5,3,6. Zinc 4,4,3,6,6,7. Tin 2,5,9,2,8,9. Nickel 6,5,4,7,7,5. Lithium 7,7,2,8,9,4. Polysilicon 8,8,1,9,6,3."},
                  {"role": "user", "content": query}
              ],
              "max_tokens": 2000
          }).encode()
          req = urllib.request.Request("https://token.sensenova.cn/v1/chat/completions", data=payload, headers={"Content-Type": "application/json", "Authorization": "Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb"}, method="POST")
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())
          content = data.get("choices", [{"message": {"content": ""}}])[0].get("message", {}).get("content", "")
          open("analysis_output.md", "w").write(content)
          print("DONE")
          PYEOF
      - name: Save result
        env:
          TOKEN: $***
        run: |
          set -e
          B64=$(base64 -w0 analysis_output.md)
          echo "B64 length: ${#B64}"
          GET_RESP=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/algo23-yunqingtian/metals-research/contents/analysis_output.md")
          echo "GET response: ${GET_RESP:0:100}"
          SHA=$(echo "$GET_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          echo "SHA: $SHA"
          if [ -n "$SHA" ] && [ "$SHA" != "None" ]; then
            echo "Updating existing file"
            PUT_RESP=$(curl -s -X PUT "https://api.github.com/repos/algo23-yunqingtian/metals-research/contents/analysis_output.md" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"message\": \"Update\", \"content\": \"$B64\", \"sha\": \"$SHA\", \"branch\": \"main\"}")
          else
            echo "Creating new file"
            PUT_RESP=$(curl -s -X PUT "https://api.github.com/repos/algo23-yunqingtian/metals-research/contents/analysis_output.md" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"message\": \"Create\", \"content\": \"$B64\", \"branch\": \"main\"}")
          fi
          echo "PUT response: ${PUT_RESP:0:200}"
          echo "SAVED"

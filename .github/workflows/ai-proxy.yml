name: AI Proxy
on:
  push:
    paths:
      - "query.txt"
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Network test
        run: |
          echo "Testing internet access..."
          curl -s --max-time 10 -o /dev/null -w "google: %{http_code}\n" https://www.google.com
          curl -s --max-time 10 -o /dev/null -w "github: %{http_code}\n" https://api.github.com
          curl -s --max-time 30 -o /tmp/sensenova_test.json -w "sensenova: %{http_code}\n" -X POST "https://token.sensenova.cn/v1/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb" -d '{"model":"sensenova-6.8-flash-lite","messages":[{"role":"user","content":"hi"}],"max_tokens":10}'
          cat /tmp/sensenova_test.json 2>/dev/null || echo "No file"
          echo "DONE"

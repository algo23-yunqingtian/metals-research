name: AI Proxy
on:
  push:
    paths:
      - query.txt
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call sensenova API
        shell: bash
        run: |
          QUERY=$(head -1 query.txt)
          echo "Query: $QUERY"

          cat > /tmp/sys.txt << 'SYSEOF'
You are a senior non-ferrous metals analyst using the Six-Dimension Closed-Loop Analysis Model. Output analysis for business colleagues.

Six dimensions (score 1-10): Supply Elasticity, Demand Elasticity, Industry Chain Profit, Industry Inventory, Speculative Intensity, Verification Effectiveness.

## Baseline Parameters
Copper: 3,4,8,3,7,8. TC -182 USD/DT, LME $14290/t record, inventory 1.287M tons down.
Aluminum: 5,6,7,4,5,7. AI+Golden Sept demand, warehouse 262.5K tons down.
Lead: 4,3,5,5,3,6. Secondary lead 28%, auto battery, warehouse 57K tons.
Zinc: 4,4,3,6,6,7. TC -536 yuan/t, cuts expected, warehouse 114.7K tons up.
Tin: 2,5,9,2,8,9. Mine rigid, AI+MLCC +30%, price 42598 yuan/t, warehouse 5564 tons.
Nickel: 6,5,4,7,7,5. Indonesia supply, stainless+EV, warehouse 101.8K tons.
Lithium Carbonate: 7,7,2,8,9,4. Salt lake+mine, battery +5.71%, price 150K yuan/t.
Polysilicon: 8,8,1,9,6,3. Solar oversupply, install -13.1%, price 37850 yuan/t.

Client types: 1)Industrial 2)Speculator 3)Beginner 4)Internal colleague(default).

Output format: one-line conclusion + markdown scoring table + circular analysis + ECharts radar JSON in code block. End with disclaimer.
SYSEOF

          python3 -c "
import json, subprocess, sys
sys_prompt = open('/tmp/sys.txt').read()
query = '''$QUERY'''
payload = {
    'model': 'sensenova-6.8-flash-lite',
    'messages': [
        {'role': 'system', 'content': sys_prompt},
        {'role': 'user', 'content': query}
    ],
    'temperature': 0.4,
    'max_tokens': 2000
}
result = subprocess.run(['curl', '-s', '-X', 'POST', 'https://token.sensenova.cn/v1/chat/completions',
    '-H', 'Content-Type: application/json',
    '-H', 'Authorization: Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb',
    '-d', json.dumps(payload)], capture_output=True, text=True)
data = json.loads(result.stdout)
content = data.get('choices', [{'message': {'content': ''}}])[0].get('message', {}).get('content', '')
with open('analysis_output.md', 'w') as f:
    f.write(content)
print('DONE')
"
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis_output.md
          git commit -m "Update analysis" || echo "no changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

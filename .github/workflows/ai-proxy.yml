name: AI Proxy
on:
  push:
    paths:
      - "query.txt"
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call API
        run: |
          QUERY=$(head -1 query.txt)
          echo "Query: $QUERY"
          python3 << 'PYEOF'
          import json, urllib.request
          query = open("query.txt").read().strip()
          payload = json.dumps({
              "model": "sensenova-6.8-flash-lite",
              "messages": [
                  {"role": "system", "content": "You are a metals analyst. Six-Dimension (1-10): Supply, Demand, Profit, Inventory, Speculation, Verification. Copper 3,4,8,3,7,8. Aluminum 5,6,7,4,5,7. Lead 4,3,5,5,3,6. Zinc 4,4,3,6,6,7. Tin 2,5,9,2,8,9. Nickel 6,5,4,7,7,5. Lithium 7,7,2,8,9,4. Polysilicon 8,8,1,9,6,3."},
                  {"role": "user", "content": query}
              ],
              "max_tokens": 2000
          }).encode()
          req = urllib.request.Request("https://token.sensenova.cn/v1/chat/completions", data=payload, headers={"Content-Type": "application/json", "Authorization": "Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb"}, method="POST")
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())
          content = data.get("choices", [{"message": {"content": ""}}])[0].get("message", {}).get("content", "")
          open("analysis_output.md", "w").write(content)
          print("API DONE, length:", len(content))
          PYEOF
      - name: Save result via python
        env:
          TOKEN: *** GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, base64, os
          with open("analysis_output.md", "rb") as f:
              b64 = base64.b64encode(f.read()).decode()
          token = os.environ["TOKEN"]
          print("TOKEN present:", bool(token), "len:", len(token))
          print("B64 length:", len(b64))

          url = "https://api.github.com/repos/algo23-yunqingtian/metals-research/contents/analysis_output.md"

          try:
              get_resp = urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": "Bearer " + token}))
              get_data = json.loads(get_resp.read())
              sha = get_data.get("sha", "")
              print("Current SHA:", sha[:20] if sha else "empty")
          except urllib.error.HTTPError as e:
              sha = ""
              print("File not found, creating new. Status:", e.code)

          body = json.dumps({
              "message": "Update analysis",
              "content": b64,
              "sha": sha,
              "branch": "main"
          }).encode()
          req = urllib.request.Request(url, data=body, headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"}, method="PUT")
          try:
              put_resp = urllib.request.urlopen(req)
              put_data = json.loads(put_resp.read())
              print("PUT OK, sha:", put_data.get("content", {}).get("sha", ""))
          except urllib.error.HTTPError as e:
              print("PUT error:", e.code, e.read().decode()[:200])
          print("SAVED")
          PYEOF
name: AI Proxy
on:
  push:
    paths:
      - "query.txt"
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Call API
        run: |
          QUERY=$(head -1 query.txt)
          echo "Query: $QUERY"
          python3 -c "
          import json, subprocess, urllib.request
          query = open('query.txt').read().strip()
          sys_prompt = 'You are a metals analyst. Six-Dimension (1-10): Supply, Demand, Profit, Inventory, Speculation, Verification. Copper 3,4,8,3,7,8. Aluminum 5,6,7,4,5,7. Lead 4,3,5,5,3,6. Zinc 4,4,3,6,6,7. Tin 2,5,9,2,8,9. Nickel 6,5,4,7,7,5. Lithium 7,7,2,8,9,4. Polysilicon 8,8,1,9,6,3.'
          payload = json.dumps({
              'model': 'sensenova-6.8-flash-lite',
              'messages': [
                  {'role': 'system', 'content': sys_prompt},
                  {'role': 'user', 'content': query}
              ],
              'max_tokens': 2000
          }).encode()
          req = urllib.request.Request('https://token.sensenova.cn/v1/chat/completions', data=payload, headers={'Content-Type': 'application/json', 'Authorization': 'Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb'}, method='POST')
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())
          content = data.get('choices', [{'message': {'content': ''}}])[0].get('message', {}).get('content', '')
          with open('analysis_output.md', 'w') as f:
              f.write(content)
          print('DONE')
          "
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis_output.md
          git commit -m "Update analysis"
          git push

name: AI Proxy
on:
  push:
    paths:
      - "query.txt"
jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run analysis
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, base64, os, time, sys, socket

          query = open("query.txt").read().strip()
          print("Query:", query)

          sys_prompt = "You are a metals analyst. Output concise Chinese analysis."

          # First, test connectivity with a simple request
          print("Testing connectivity...")
          for test in range(3):
              try:
                  test_payload = json.dumps({"model": "sensenova-6.8-flash-lite", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 10}).encode()
                  req = urllib.request.Request("https://token.sensenova.cn/v1/chat/completions", data=test_payload, headers={"Content-Type": "application/json", "Authorization": "Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb"}, method="POST")
                  resp = urllib.request.urlopen(req, timeout=30)
                  data = json.loads(resp.read())
                  print("Test OK:", data.get("model", ""))
                  break
              except Exception as e:
                  print(f"Test {test+1} failed: {str(e)[:100]}")
                  time.sleep(5)

          # Now make the real request with retries
          content = ""
          for attempt in range(10):
              try:
                  payload = json.dumps({
                      "model": "sensenova-6.8-flash-lite",
                      "messages": [
                          {"role": "system", "content": sys_prompt},
                          {"role": "user", "content": query}
                      ],
                      "max_tokens": 5000
                  }).encode()
                  req = urllib.request.Request(
                      "https://token.sensenova.cn/v1/chat/completions",
                      data=payload,
                      headers={"Content-Type": "application/json", "Authorization": "Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb"},
                      method="POST"
                  )
                  resp = urllib.request.urlopen(req, timeout=180)
                  data = json.loads(resp.read())
                  msg = data.get("choices", [{"message": {}}])[0].get("message", {})
                  content = msg.get("content", "") or msg.get("reasoning", "")
                  print(f"Attempt {attempt+1} success, content length: {len(content)}")
                  break
              except Exception as e:
                  print(f"Attempt {attempt+1} failed: {str(e)[:200]}")
                  time.sleep(15)

          if not content:
              print("ALL ATTEMPTS FAILED")
              sys.exit(1)

          open("analysis_output.md", "w").write(content)
          print("File written, size:", len(content))

          token = os.environ.get("GITHUB_TOKEN", "")
          print("GITHUB_TOKEN present:", bool(token))
          b64 = base64.b64encode(content.encode()).decode()
          url = "https://api.github.com/repos/algo23-yunqingtian/metals-research/contents/analysis_output.md"
          body = json.dumps({"message": "Update", "content": b64, "branch": "main"}).encode()
          req = urllib.request.Request(url, data=body, headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"}, method="PUT")
          try:
              resp = urllib.request.urlopen(req)
              data = json.loads(resp.read())
              print("SAVED sha:", data.get("content", {}).get("sha", ""))
          except urllib.error.HTTPError as e:
              print("SAVE HTTP", e.code, e.read().decode()[:300])
              sys.exit(1)
          PYEOF

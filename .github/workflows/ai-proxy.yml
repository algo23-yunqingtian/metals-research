name: AI Proxy
on:
  push:
    paths:
      - "query.txt"
jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run analysis
        run: |
          QUERY=$(head -1 query.txt)
          echo "Query: $QUERY"
          echo "=== STEP 1: Call sensenova API ==="
          curl -v --max-time 60 -o /tmp/response.json -X POST "https://token.sensenova.cn/v1/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb" -d '{"model":"sensenova-6.8-flash-lite","messages":[{"role":"system","content":"You are a metals analyst."},{"role":"user","content":"'$QUERY'"}],"max_tokens":1000}'
          echo "=== Response ==="
          cat /tmp/response.json
          echo ""
          echo "=== STEP 2: Extract ==="
          CONTENT=$(python3 -c "import json; d=json.load(open('/tmp/response.json')); msg=d.get('choices', [{'message': {}}])[0].get('message', {}); content=msg.get('content', ''); reasoning=msg.get('reasoning', ''); print(content if content else reasoning)")
          echo "Content length: ${#CONTENT}"
          echo "$CONTENT" > analysis_output.md
          echo "=== STEP 3: Save ==="
          B64=$(base64 -w0 analysis_output.md)
          curl -s -f -X PUT "https://api.github.com/repos/algo23-yunqingtian/metals-research/contents/analysis_output.md" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "{\"message\":\"Update\",\"content\":\"$B64\",\"branch\":\"main\"}"
          echo "SAVED"

name: AI Proxy
on:
  push:
    paths:
      - "query.txt"
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call sensenova API
        shell: bash
        run: |
          QUERY=$(head -1 query.txt)
          echo "Query: $QUERY"
          SYS_PROMPT="You are a metals analyst. Use Six-Dimension model (1-10): Supply, Demand, Profit, Inventory, Speculation, Verification. Copper 3,4,8,3,7,8. Aluminum 5,6,7,4,5,7. Lead 4,3,5,5,3,6. Zinc 4,4,3,6,6,7. Tin 2,5,9,2,8,9. Nickel 6,5,4,7,7,5. Lithium 7,7,2,8,9,4. Polysilicon 8,8,1,9,6,3. Output: conclusion + table + analysis + radar JSON."
          python3 -c "
          import json, subprocess
          q = open('query.txt').read().strip()
          p = {
              'model': 'sensenova-6.8-flash-lite',
              'messages': [
                  {'role': 'system', 'content': '''$SYS_PROMPT'''},
                  {'role': 'user', 'content': q}
              ],
              'temperature': 0.4,
              'max_tokens': 2000
          }
          r = subprocess.run(['curl', '-s', '-X', 'POST', 'https://token.sensenova.cn/v1/chat/completions', '-H', 'Content-Type: application/json', '-H', 'Authorization: Bearer sk-npNImIR95e1f7xp17lqhv1ZuLwrmx5nb', '-d', json.dumps(p)], capture_output=True, text=True)
          d = json.loads(r.stdout)
          c = d.get('choices', [{'message': {'content': ''}}])[0].get('message', {}).get('content', '')
          open('analysis_output.md', 'w').write(c)
          print('DONE')
          "
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis_output.md
          git commit -m "Update" || echo skip
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
